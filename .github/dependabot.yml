version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current — Dependabot bumps the pin + comment
  # together, so pinning stays maintainable instead of going stale.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Runtime + dev dependencies (rich, pyyaml, platformdirs, ruff, pytest).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
