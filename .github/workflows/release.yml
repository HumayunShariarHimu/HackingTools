name: release

# Fires when a version tag is pushed (e.g. `git tag v2.0.1 && git push --tags`).
# Jobs are independent: PyPI, GHCR, and the .deb each publish on their own, so a
# hiccup in the secondary .deb channel never blocks the PyPI/container release.
#
# Supply-chain posture (M8):
#   - Third-party actions are pinned to a commit SHA (Dependabot bumps them) so a
#     re-tagged action can't silently change what runs. See .github/dependabot.yml.
#   - Artifacts get SLSA build-provenance + a CycloneDX SBOM attestation, verifiable
#     with `gh attestation verify`.
#   - PyPI upload carries PEP 740 digital attestations automatically (Trusted
#     Publishing + gh-action-pypi-publish).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + SBOM + attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # sign provenance/SBOM attestations via Sigstore (OIDC)
      attestations: write     # write attestations to the repo's attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine cyclonedx-bom
      - name: Build sdist + wheel
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      - name: Generate CycloneDX SBOM
        # Install the built wheel into a throwaway env and snapshot its real
        # dependency closure (hackingtool + rich + pyyaml + platformdirs + transitives).
        run: |
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install --upgrade pip
          /tmp/sbomenv/bin/pip install dist/*.whl
          mkdir -p sbom
          cyclonedx-py environment /tmp/sbomenv --of JSON -o sbom/hackingtool.cdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/*.whl"
          sbom-path: "sbom/hackingtool.cdx.json"
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

  pypi-publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    # One-time owner setup: on PyPI, add this repo as a Trusted Publisher for the
    # `hackingtool` project (Publishing → Add a pending publisher). No API token
    # or secret is stored — OIDC below authenticates the upload, and PEP 740
    # attestations are generated and published automatically.
    environment:
      name: pypi
      url: https://pypi.org/p/hackingtool
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1   # pinned to a tag: required for Trusted Publishing

  docker:
    name: Build + push image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io — authenticates via GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deb:
    name: Build .deb + attach SBOM to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the .deb + SBOM assets to the GitHub Release
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
      - name: Build .deb from the sdist
        run: |
          sdist=$(ls dist/hackingtool-*.tar.gz)
          fpm -s python -t deb \
            --python-bin python3 \
            --python-pip "$(command -v pip3)" \
            --python-package-name-prefix python3 \
            --depends python3 \
            --maintainer "Z4nzu" \
            --license MIT \
            --description "All-in-one hacking tool launcher for security researchers" \
            --url "https://github.com/Z4nzu/hackingtool" \
            "$sdist"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            *.deb
            sbom/hackingtool.cdx.json
