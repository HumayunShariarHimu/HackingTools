- title: Amass (Attack Surface Mapping)
  tags:
  - subdomain-enum
  - recon
  - osint
  - dns
  usage:
  - - active + passive enumeration
    - amass enum -d <domain>
  - - passive-only enumeration
    - amass enum -passive -d <domain>
  - - intel gathering by domain
    - amass intel -d <domain>
- title: Masscan (Fast Port Scanner)
  tags:
  - port-scan
  - scanner
  - network
  usage:
  - - scan all ports on a range
    - sudo masscan <ip-range> -p1-65535 --rate 1000
  - - scan common web ports
    - sudo masscan <ip-range> -p80,443 --rate 10000
