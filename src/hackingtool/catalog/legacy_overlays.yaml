# Legacy tool overlays — tags (+ verified usage) for tools that are defined
# as Python classes rather than catalog YAML. Matched to the existing tool by
# exact title; `tags` are a subset of tags.TAXONOMY (enforced by tests). This
# lets the data-driven catalog power search/recommend/AI2 for these tools too.
# Curated in M7. Surveillance/C2/keylogger tools are tags-only by design.
